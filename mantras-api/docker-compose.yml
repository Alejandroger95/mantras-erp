services:

  # ── PostgreSQL local ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mantrasdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Monta los SQL del ERP para poder correr run_all.sh contra este contenedor
      - ../docs:/docker-entrypoint-initdb.d/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      # host.docker.internal → PostgreSQL local del Mac (donde están los schemas)
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/mantrasdb
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    command: npm run dev

volumes:
  pgdata:
